# Gradle itself needs JVM 17+; the build compiles against the Java 25 toolchain.
# These are the Homebrew install paths behind the java21 / java25 zsh shortcuts, declared so
# Gradle finds the JDK 25 toolchain locally instead of downloading one — and so the build works
# no matter which shortcut is active in the current shell.
org.gradle.java.installations.paths=/opt/homebrew/opt/openjdk@25,/opt/homebrew/opt/openjdk@21

org.gradle.caching=true
org.gradle.parallel=true