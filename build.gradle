plugins {
    // Declared here so module build files can apply it without repeating a version.
    // Only distrikv-proto actually applies it.
    alias(libs.plugins.protobuf) apply false
}

description = 'A distributed, crash-safe key-value store built from scratch.'

// Captured here because inside `subprojects { }` the delegate is the subproject, which has no
// `libs` accessor of its own.
def catalog = libs

subprojects {
    apply plugin: 'java-library'

    group = 'io.distrikv'
    version = '0.1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    dependencies {
        // Every module gets the test stack.
        testImplementation platform(catalog.junit.bom)
        testImplementation catalog.junit.jupiter
        testImplementation catalog.assertj.core
        testRuntimeOnly catalog.junit.platform.launcher
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        // Turn on the warnings that catch real bugs, and take them seriously.
        options.compilerArgs << '-Xlint:all'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform {
            // Long-running measurements (the 1GB reopen timing) are tagged 'slow' and stay out
            // of the normal build. Run them with: ./gradlew test -PincludeSlow
            if (!project.hasProperty('includeSlow')) {
                excludeTags 'slow'
            }
        }
        // Tests run in a forked JVM, so -D on the Gradle command line does not reach them.
        // Forward the knobs the slow tests read (oracle op count, concurrency duration, crash
        // acknowledgement target, reopen size) so the exit criteria can be run at full scale:
        //   ./gradlew test -PincludeSlow -Ddistrikv.oracle.ops=1000000
        System.properties.each { name, value ->
            if (name.toString().startsWith('distrikv.')) {
                systemProperty name.toString(), value
            }
        }

        // The 1GB reopen measurement holds ~1M keys in the KeyDir. At roughly 150 bytes per
        // key (see docs/decisions/004) that is a few hundred MB of index, well above the
        // default heap.
        maxHeapSize = '2g'

        // Crash tests fork JVMs and kill them; don't let that confuse the reports.
        testLogging {
            showStackTraces = true
            exceptionFormat = 'full'
            events 'failed'
        }
    }
}